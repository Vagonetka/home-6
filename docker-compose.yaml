version: '3'

services:
  db:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cms
      MYSQL_USER: cmsuser
      MYSQL_PASSWORD: cmspass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: cmsuser
      WORDPRESS_DB_PASSWORD: cmspass
      WORDPRESS_DB_NAME: cms
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=telegraf
      - INFLUXDB_USER=telegraf
      - INFLUXDB_USER_PASSWORD=telegrafpass
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    volumes:
      - ./TICK-1/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
    depends_on:
      - influxdb
    restart: unless-stopped

  chronograf:
    image: chronograf:latest
    container_name: chronograf
    ports:
      - "8888:8888"
    volumes:
      - chronograf_data:/var/lib/chronograf
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=telegraf
      - INFLUXDB_PASSWORD=telegrafpass
      - INFLUXDB_DB=telegraf
    depends_on:
      - influxdb
    restart: unless-stopped

  kapacitor:
    image: kapacitor:latest
    container_name: kapacitor
    user: root
    ports:
      - "9092:9092"
    environment:
      - KAPACITOR_INFLUXDB_0_URLS=http://influxdb:8086
      - KAPACITOR_INFLUXDB_0_USERNAME=telegraf
      - KAPACITOR_INFLUXDB_0_PASSWORD=telegrafpass
      - KAPACITOR_INFLUXDB_0_DATABASE=telegraf
    volumes:
      - kapacitor_data:/var/lib/kapacitor
      - ./kapacitor/tasks:/etc/kapacitor/tasks:ro
      - ./TICK-1/kapacitor.conf:/etc/kapacitor/kapacitor.conf:ro
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  db_data:
  wordpress_data:
  influxdb_data:
  chronograf_data:
  kapacitor_data: