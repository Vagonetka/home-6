[agent]
  interval = "10s"
  hostname = "cms-server"

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs"]

[[inputs.diskio]]

[[inputs.mem]]

[[inputs.net]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.mysql]]
  servers = ["cmsuser:cmspass@tcp(db:3306)/cms"]

[[inputs.http_response]]
  urls = ["http://wordpress"]
  response_timeout = "5s"

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  username = "telegraf"
  password = "telegrafpass"